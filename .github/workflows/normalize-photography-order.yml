name: Normalize photography data

on:
  push:
    branches: [main]
    paths:
      - "src/data/content/photography/*.json"
      - "src/data/content/film-stocks/*.json"

permissions:
  contents: write

concurrency:
  group: normalize-photography-data
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Save new film stocks
        run: node scripts/sync-film-stocks.mjs

      - name: Normalize duplicate positions
        run: node scripts/normalize-photography-order.mjs

      - name: Commit normalized photography data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/data/content/photography src/data/content/film-stocks .pages.yml)" ]; then
            echo "Photography data is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/content/photography src/data/content/film-stocks .pages.yml
          git commit -m "content: normalize photography data"
          git push origin main
